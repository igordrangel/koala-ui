@if (config(); as config) {
  @switch (config.type) {
    @case ('combobox') {
      <app-combobox
        #comboboxField
        size="xs"
        [options]="options()"
        [placeholder]="config.placeholder || 'Select an option'"
        [multiple]="config.multiple"
        [formField]="valueForm.value"
        [inline]="!isMobile"
      />
    }
  }
}
