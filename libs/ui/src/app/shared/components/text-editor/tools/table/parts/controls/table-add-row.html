@if (visible()) {
  <button
    type="button"
    class="absolute pointer-events-auto flex items-center justify-center bg-primary/20 hover:bg-primary text-[0.5rem] cursor-pointer rounded-b transition-colors border-0 p-1"
    [style.top.px]="position().top"
    [style.left.px]="position().left"
    [style.width.px]="position().width"
    (mouseenter)="onButtonMouseEnter()"
    (mouseleave)="onButtonMouseLeave()"
    (click)="add()"
  >
    <i class="fa-solid fa-plus"></i>
  </button>
}
