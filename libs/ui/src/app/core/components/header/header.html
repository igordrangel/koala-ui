<ng-template #logotype>
  <a [routerLink]="homeLink()">
    <span class="flex items-center gap-3 mr-6">
      <i class="app-icon kl-logotype size-6!"></i>
    </span>
  </a>
</ng-template>

<ng-template #docsVersionSwitcher>
  <div class="flex items-center gap-0.5 rounded-lg border border-base-300 p-0.5">
    @for (entry of docsVersions; track entry.basePath) {
      <button
        type="button"
        class="px-2 py-1 text-xs rounded-md transition-colors font-semibold"
        [class.bg-base-200]="isDocsVersionCurrent(entry)"
        [class.opacity-100]="isDocsVersionCurrent(entry)"
        [class.opacity-50]="!isDocsVersionCurrent(entry)"
        (click)="switchDocsVersion(entry)"
      >
        {{ docsVersionLabel(entry) }}
      </button>
    }
  </div>
</ng-template>

<ng-template #localeSwitcher>
  <div class="flex items-center gap-0.5 rounded-lg border border-base-300 p-0.5">
    <button
      type="button"
      class="px-2 py-1 text-xs rounded-md transition-colors"
      [class.bg-base-200]="locale() === 'pt'"
      [class.opacity-100]="locale() === 'pt'"
      [class.opacity-50]="locale() !== 'pt'"
      (click)="switchLocale('pt')"
    >
      PT
    </button>
    <button
      type="button"
      class="px-2 py-1 text-xs rounded-md transition-colors"
      [class.bg-base-200]="locale() === 'en'"
      [class.opacity-100]="locale() === 'en'"
      [class.opacity-50]="locale() !== 'en'"
      (click)="switchLocale('en')"
    >
      EN
    </button>
  </div>
</ng-template>

<ng-template #navButtons>
  <a
    class="opacity-60 justify-start lg:justify-center md:inline-flex"
    appButton
    btnSize="sm"
    btnVariant="ghost"
    [routerLink]="'getting-started' | localePath"
    routerLinkActive="opacity-100"
  >
    {{ copy().gettingStarted }}
  </a>

  <a
    class="opacity-60 justify-start lg:justify-center md:inline-flex"
    appButton
    btnSize="sm"
    btnVariant="ghost"
    [routerLink]="'components' | localePath"
    routerLinkActive="opacity-100"
  >
    {{ copy().components }}
  </a>

  <a
    class="opacity-60 justify-start lg:justify-center md:inline-flex"
    appButton
    btnSize="sm"
    btnVariant="ghost"
    [routerLink]="'blocks' | localePath"
    routerLinkActive="opacity-100"
  >
    {{ copy().blocks }}
  </a>

  <a
    class="opacity-60 justify-start lg:justify-center md:inline-flex"
    appButton
    btnSize="sm"
    btnVariant="ghost"
    [routerLink]="'resources' | localePath"
    routerLinkActive="opacity-100"
  >
    {{ copy().resources }}
  </a>
</ng-template>

@if (mobileMenuVisible()) {
  <button
    class="fixed inset-0 z-30 bg-black/40 transition-opacity duration-200 ease-out lg:hidden"
    [class.opacity-100]="mobileMenuOpen()"
    [class.opacity-0]="!mobileMenuOpen()"
    (click)="closeMobileMenu()"
    aria-label="Close navigation menu"
    type="button"
  ></button>
}

<aside
  class="fixed left-0 top-0 z-40 h-full w-72 max-w-[85vw] bg-base-100 border-r border-base-300 shadow-xl transition-transform duration-200 ease-out lg:hidden flex flex-col"
  [class.translate-x-0]="mobileMenuOpen()"
  [class.-translate-x-full]="!mobileMenuOpen()"
>
  <div class="px-4 py-4 border-b border-base-300 flex items-center justify-between gap-3 shrink-0">
    <ng-container *ngTemplateOutlet="logotype" />
  </div>

  <app-nav-menu class="block flex-1 overflow-y-auto"></app-nav-menu>

  <div class="px-3 py-3 border-t border-base-300 shrink-0">
    <div class="grid grid-cols-1 gap-2">
      <ng-container *ngTemplateOutlet="navButtons" />
    </div>
    <div class="flex items-center justify-between gap-2 mt-3 pt-3 border-t border-base-300">
      <span class="text-xs opacity-60">{{ copy().version }}</span>
      <ng-container *ngTemplateOutlet="docsVersionSwitcher" />
    </div>
    <div class="flex items-center justify-between gap-2 mt-3 pt-3 border-t border-base-300">
      <span class="text-xs opacity-60">{{ copy().language }}</span>
      <ng-container *ngTemplateOutlet="localeSwitcher" />
    </div>
  </div>
</aside>

<div class="flex items-center justify-between py-2 w-full bg-base-100 min-w-0">
  <button
    class="lg:hidden flex items-center gap-2 rounded-lg border border-base-300 bg-base-100 px-3 py-1.5 text-sm font-medium shrink-0"
    (click)="toggleMobileMenu()"
    aria-label="Toggle navigation menu"
    type="button"
  >
    <i class="fa-solid fa-bars"></i>
    {{ copy().menu }}
  </button>

  <div class="hidden lg:flex items-center shrink-0">
    <ng-container *ngTemplateOutlet="logotype" />
    <div class="mr-4">
      <ng-container *ngTemplateOutlet="docsVersionSwitcher" />
    </div>
    <ng-container *ngTemplateOutlet="navButtons" />
  </div>

  <div class="flex items-center min-w-0 gap-1 ml-auto shrink-0">
    <app-doc-search class="mr-1" />

    <div class="flex lg:hidden items-center mr-1">
      <ng-container *ngTemplateOutlet="docsVersionSwitcher" />
    </div>

    <div class="hidden md:flex items-center ml-1 mr-1">
      <ng-container *ngTemplateOutlet="localeSwitcher" />
    </div>

    <button
      appButton
      btnSize="sm"
      btnVariant="ghost"
      (click)="copyLlmsUrl()"
      [appTooltip]="copy().copyAiTooltip"
      tooltipPosition="bottom"
      class="relative transition-colors whitespace-nowrap"
    >
      @if (copied()) {
        <i class="fa-solid fa-check text-success"></i>
        <span class="text-success">{{ copy().copied }}</span>
      } @else {
        <i class="fa-regular fa-clipboard"></i>
        <span class="sm:hidden">{{ copy().copyAiShort }}</span>
        <span class="hidden sm:inline">{{ copy().copyAiIndex }}</span>
      }
    </button>

    <app-github-stars class="w-auto" />
  </div>
</div>
