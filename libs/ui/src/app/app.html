<ngx-loading-bar color="#6A1B9A" height="4px" [includeSpinner]="false" />

<div class="flex flex-col px-5 lg:px-15 mx-auto overflow-x-hidden">
  <app-header
    class="fixed left-4 right-4 lg:left-15 lg:right-15 px-0 lg:px-0 lg:pl-5 z-10 box-border"
  />

  <div class="flex w-full">
    <app-nav-menu class="fixed hidden lg:block empty:hidden" />

    <section
      class="min-w-0 flex-1 lg:ml-60 mt-16 min-h-[calc(100vh-4rem)] flex flex-col"
      [class.ml-0!]="isFullWidthPage()"
    >
      <div class="flex-1">
        <router-outlet />
      </div>

      <app-footer [isHomePage]="isHomePage() ?? false" />
    </section>
  </div>
</div>
