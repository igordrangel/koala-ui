<app-section-container>
  <ng-container title>{{ copy().title }}</ng-container>
  <ng-container description>{{ copy().description }}</ng-container>

  <app-section-content>
    <ng-container title>{{ common().installation }}</ng-container>
    <ng-container description>{{ copy().sections.installation.description }}</ng-container>

    <app-code-viewer language="bash" name="kl" src="markdown/install/login-install.md" />
  </app-section-content>

  <app-section-content>
    <ng-container title>{{ copy().sections.sample.title }}</ng-container>

    <div appTabGroup align="start" class="flex items-center">
      <div appTab [label]="common().preview" checked>
        <div
          class="flex flex-col items-center justify-center gap-2 border border-t-0 p-4 border-base-300 rounded-b-lg"
        >
          <app-login-preview-sample />
        </div>
      </div>

      <div appTab [label]="common().formHtmlPage">
        <div class="flex p-2 border border-t-0 border-base-300 rounded-b-lg">
          <app-code-viewer
            class="w-full"
            language="html"
            name="login-form-sample.html"
            src="markdown/usage/login/login-form.html.md"
          />
        </div>
      </div>

      <div appTab [label]="common().formTsPage">
        <div class="flex p-2 border border-t-0 border-base-300 rounded-b-lg">
          <app-code-viewer
            class="w-full"
            language="typescript"
            name="login-form-sample.ts"
            src="markdown/usage/login/login-form.ts.md"
          />
        </div>
      </div>

      <div appTab [label]="common().loggedHtmlPage">
        <div class="flex p-2 border border-t-0 border-base-300 rounded-b-lg">
          <app-code-viewer
            class="w-full"
            language="html"
            name="logged-sample.html"
            src="markdown/usage/login/logged-sample.html.md"
          />
        </div>
      </div>

      <div appTab [label]="common().loggedTsPage">
        <div class="flex p-2 border border-t-0 border-base-300 rounded-b-lg">
          <app-code-viewer
            class="w-full"
            language="typescript"
            name="logged-sample.ts"
            src="markdown/usage/login/logged-sample.ts.md"
          />
        </div>
      </div>
    </div>
  </app-section-content>
</app-section-container>
