<div

>
  <app-showcase-card

  >
    <app-breadcrumb-sample />
  </app-showcase-card>

  <app-showcase-card
    class="md:col-span-2"
    title="Feedback"

      <app-alert-trigger-sample />
      <app-toast-trigger-sample />

  <app-showcase-card title="Modal" description="Dialog overlay." docLink="/components/modal">

  <app-showcase-card
    title="Skeleton"

    description="Date picker input."
    docLink="/components/calendar"

    <app-calendar-date-sample />

  <app-showcase-card

    class="md:col-span-2"
