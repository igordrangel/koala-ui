<app-section-container>
  <ng-container title>{{ copy().title }}</ng-container>
  <ng-container description>{{ copy().description }}</ng-container>

  <app-section-content>
    <ng-container title>{{ common().installation }}</ng-container>
    <ng-container description>{{ copy().sections.installation.description }}</ng-container>

    <app-code-viewer language="bash" name="kl" src="markdown/install/pagination-install.md" />
  </app-section-content>

  <app-section-content>
    <ng-container title>{{ copy().sections.sizes.title }}</ng-container>
    <ng-container description>{{ copy().sections.sizes.description }}</ng-container>

    <div appTabGroup align="start" class="flex items-center">
      <div appTab [label]="common().preview" checked>
        <div
          class="flex flex-col items-center justify-center gap-2 p-4 sm:p-10 border border-t-0 border-base-300 rounded-b-lg"
        >
          <app-pagination class="w-full" size="xs" [page]="1" [pageSize]="30" [total]="100" />
          <app-pagination class="w-full" size="sm" [page]="1" [pageSize]="30" [total]="100" />
          <app-pagination class="w-full" size="md" [page]="1" [pageSize]="30" [total]="100" />
          <app-pagination class="w-full" size="lg" [page]="1" [pageSize]="30" [total]="100" />
          <app-pagination class="w-full" size="xl" [page]="1" [pageSize]="30" [total]="100" />
        </div>
      </div>

      <div appTab [label]="common().html">
        <div class="flex p-2 border border-t-0 border-base-300 rounded-b-lg">
          <app-code-viewer
            class="w-full"
            language="html"
            name="pagination-sample.html"
            src="markdown/usage/pagination/pagination.html.md"
          />
        </div>
      </div>

      <div appTab [label]="common().ts">
        <div class="flex p-2 border border-t-0 border-base-300 rounded-b-lg">
          <app-code-viewer
            class="w-full"
            language="typescript"
            name="pagination-sample.ts"
            src="markdown/usage/pagination/pagination.ts.md"
          />
        </div>
      </div>
    </div>
  </app-section-content>
</app-section-container>
