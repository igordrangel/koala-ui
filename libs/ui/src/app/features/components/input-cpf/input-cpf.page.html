<app-section-container>
  <ng-container title>{{ copy().title }}</ng-container>
  <ng-container description>{{ copy().description }}</ng-container>

  <app-section-content>
    <ng-container title>{{ common().installation }}</ng-container>
    <ng-container description>{{ copy().sections.installation.description }}</ng-container>

    <app-code-viewer language="bash" name="kl" src="markdown/install/input-cpf-install.md" />
  </app-section-content>

  <app-section-content>
    <ng-container title>{{ copy().sections.usage.title }}</ng-container>

    <div appTabGroup align="start" class="flex items-center">
      <div appTab [label]="common().preview" checked>
        <div
          class="flex flex-col items-center justify-center gap-2 p-4 sm:p-10 border border-t-0 border-base-300 rounded-b-lg"
        >
          <app-fieldset [field]="cpfForm.cpf()">
            <ng-container label>CPF</ng-container>
            <input
              field
              appInput
              type="text"
              placeholder="Type here"
              [formField]="cpfForm.cpf"
              appMask="000.000.000-00"
            />
            <ng-container hint>Inform a valid CPF</ng-container>
          </app-fieldset>
        </div>
      </div>

      <div appTab [label]="common().html">
        <div class="flex p-2 border border-t-0 border-base-300 rounded-b-lg">
          <app-code-viewer
            class="w-full"
            language="html"
            name="input-cpf-sample.html"
            src="markdown/usage/input-cpf/input-cpf.html.md"
          />
        </div>
      </div>

      <div appTab [label]="common().ts">
        <div class="flex p-2 border border-t-0 border-base-300 rounded-b-lg">
          <app-code-viewer
            class="w-full"
            language="typescript"
            name="input-cpf-sample.ts"
            src="markdown/usage/input-cpf/input-cpf.ts.md"
          />
        </div>
      </div>
    </div>
  </app-section-content>
</app-section-container>
