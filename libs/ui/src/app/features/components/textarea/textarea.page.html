<app-section-container>
  <ng-container title>{{ copy().title }}</ng-container>
  <ng-container description>{{ copy().description }}</ng-container>

  <app-section-content>
    <ng-container title>{{ common().installation }}</ng-container>
    <ng-container description>{{ copy().sections.installation.description }}</ng-container>

    <app-code-viewer language="bash" name="kl" src="markdown/install/textarea-install.md" />
  </app-section-content>

  <app-section-content>
    <ng-container title>{{ copy().sections.sizes.title }}</ng-container>
    <ng-container description>{{ copy().sections.sizes.description }}</ng-container>

    <div appTabGroup align="start" class="flex items-center">
      <div appTab [label]="common().preview" checked>
        <div
          class="flex flex-col items-center justify-center gap-2 p-4 sm:p-10 border border-t-0 border-base-300 rounded-b-lg"
        >
          <textarea appTextarea rows="4" size="xs" placeholder="Type here"></textarea>
          <textarea appTextarea rows="4" size="sm" placeholder="Type here"></textarea>
          <textarea appTextarea rows="4" size="md" placeholder="Type here"></textarea>
          <textarea appTextarea rows="4" size="lg" placeholder="Type here"></textarea>
          <textarea appTextarea rows="4" size="xl" placeholder="Type here"></textarea>
        </div>
      </div>

      <div appTab [label]="common().html">
        <div class="flex p-2 border border-t-0 border-base-300 rounded-b-lg">
          <app-code-viewer
            class="w-full"
            language="html"
            name="textarea-sample.html"
            src="markdown/usage/textarea/textarea-sizes.html.md"
          />
        </div>
      </div>

      <div appTab [label]="common().ts">
        <div class="flex p-2 border border-t-0 border-base-300 rounded-b-lg">
          <app-code-viewer
            class="w-full"
            language="typescript"
            name="textarea-sample.ts"
            src="markdown/usage/textarea/textarea.ts.md"
          />
        </div>
      </div>
    </div>
  </app-section-content>
</app-section-container>
