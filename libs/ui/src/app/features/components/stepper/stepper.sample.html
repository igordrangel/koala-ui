<app-stepper-container #stepper class="w-full">
  <ng-container steps>
    <span appStep>Step 1</span>
    <span appStep>Step 2</span>
    <span appStep>Step 3</span>
  </ng-container>

  @switch (stepper.currentStep()) {
    @case (1) {
      <form class="w-full p-2">
        <h4 class="text-sm font-semibold">Step 1</h4>
        <span class="divider"></span>
        <div class="flex justify-end">
          <button
            type="button"
            appButton
            btnVariant="primary"
            btnSize="sm"
            (click)="stepper.next()"
          >
            Next
          </button>
        </div>
      </form>
    }
    @case (2) {
      <form class="w-full p-2">
        <h4 class="text-sm font-semibold">Step 2</h4>
        <span class="divider"></span>
        <div class="flex justify-end gap-2">
          <button
            type="button"
            appButton
            btnVariant="primary"
            btnSoft
            btnSize="sm"
            (click)="stepper.previous()"
          >
            Previous
          </button>
          <button
            type="button"
            appButton
            btnVariant="primary"
            btnSize="sm"
            (click)="stepper.next()"
          >
            Next
          </button>
        </div>
      </form>
    }
    @case (3) {
      <form class="w-full p-2">
        <h4 class="text-sm font-semibold">Step 3</h4>
        <span class="divider"></span>
        <div class="flex justify-end">
          <button
            type="button"
            appButton
            btnVariant="primary"
            btnSoft
            btnSize="sm"
            (click)="stepper.previous()"
          >
            Previous
          </button>
        </div>
      </form>
    }
  }
</app-stepper-container>
