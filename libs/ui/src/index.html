<!doctype html>
<html lang="en" class="dark" data-theme="koala">
  <head>
    <meta charset="utf-8" />
    <title>koalarx/ui</title>
    <base href="/" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Migrate legacy hash routes (#/path) to localized path URLs (respects <base href>).
      (function () {
        var hash = location.hash;
        if (hash.indexOf('#/') !== 0) return;

        var baseEl = document.querySelector('base');
        var base = (baseEl && baseEl.getAttribute('href')) || '/';
        if (base.charAt(base.length - 1) === '/') base = base.slice(0, -1);

        // Latest SPA (base `/`) wrongly serving `/v{major}/#/…` (local ng serve):
        // do not strip the version prefix back into `/pt/…` on this host.
        var versionMatch = location.pathname.match(/^\/(v\d+)(?=\/|$)/);
        if (versionMatch && !base) {
          if (location.hostname !== 'ui.koalarx.com') {
            location.replace(
              'https://ui.koalarx.com/' +
                versionMatch[1] +
                '/' +
                location.search +
                hash,
            );
          }
          return;
        }

        var path = hash.slice(1);
        if (!/^\/(pt|en)(\/|$)/.test(path)) {
          path = path === '/' ? '/pt' : '/pt' + path;
        }
        history.replaceState(null, '', base + path + location.search);
      })();
    </script>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Unbounded:wght@200..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
