<kl-input-text
  [control]="control()"
  [label]="label()"
  [placeholder]="placeholder()"
  [hint]="hint()"
  mask="000.000.000-00">

  <ng-container errors>
    @if (control().errors?.['cpfInvalid']) {
      <div class="error-message">{{ translations.invalidCPF }}</div>
    }
    <ng-content select="[errors]" />
  </ng-container>
</kl-input-text>
