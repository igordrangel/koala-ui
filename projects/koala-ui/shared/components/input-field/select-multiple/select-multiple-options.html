<div class="bg-base-300 overflow-hidden shadow border border-neutral-200 dark:border-neutral-700 rounded-lg flex flex-col w-full"
  [attr.aria-labelledby]="fieldId()">

  <div class="kl-select-multiple-filter border-b border-neutral-200 dark:border-neutral-700">
    <label class="flex items-center text-sm">
      <i class="fa-solid fa-magnifying-glass opacity-60 absolute top-3 left-4"></i>
      <input class="w-full p-2 pr-3 pl-10 outline-none placeholder:opacity-60"
        #searchInput
        type="search"
        [formControl]="selectMultipleValue().filterControl"
        placeholder="Type to Search..."
      />
    </label>
  </div>

  <div class="kl-select-multiple-options-container flex flex-col overflow-auto p-1">
    @for (item of list(); track $index) {
      @let optionLabelId = fieldId() + '-' + item.value;

      <label class="relative py-1 px-2 pr-8 rounded-md"
        [attr.for]="optionLabelId"
        [class.active]="$index === optionFocused()"
        (mouseover)="optionFocused.set($index)">

        <input
          type="checkbox"
          [id]="optionLabelId"
          [name]="fieldId()"
          [attr.value]="item.value"
          [checked]="control().value?.includes(item.value)"
          (change)="setValue($event)"
        />
        {{item.label}}
      </label>
    }
  </div>
</div>
