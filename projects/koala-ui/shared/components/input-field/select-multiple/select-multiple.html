<button class="select-multiple-button relative select hover:cursor-default bg-base-100 w-full min-h-10 h-full flex items-center justify-between flex-nowrap select-text"
  [class.has-value]="selectMultipleValue.hasValue()"
  type="button"
  tabindex="0"
  [id]="fieldId"
  [disabled]="isDisabled() || isLoading()"
  (focus)="control().markAsTouched()"
  (click)="open()">

  <span class="select-multiple-label flex items-center gap-2 whitespace-nowrap text-neutral-900 dark:text-neutral-300">
    <span>{{label()}} {{ isRequired() ? '*' : '' }}</span>
  </span>

  <div class="flex flex-wrap gap-1 pt-3 pb-2 items-center w-full h-full selected-options"
    [hookChange]="!isLoading() && (selectMultipleValue.filter() || selectMultipleValue.currentValue())"
    [class.d-none]="!selectMultipleValue.hasValue()">

    @for (item of selectMultipleValue.currentValue(); track $index) {
      <span class="flex items-center badge badge-primary badge-sm rounded-sm">
        <span>{{item.label}}</span>
        <i class="fa-solid fa-xmark text-neutral-400 hover:cursor-pointer"
          (click)="selectMultipleValue.remove($event, item.value)">
        </i>
      </span>
    }
  </div>

  @if (isLoading()) {
    <kl-loader size="small" />
  } @else if (selectMultipleValue.hasValue()) {
    <i class="fa-solid fa-xmark text-neutral-500 hover:cursor-pointer pt-1 pr-2"
      (click)="selectMultipleValue.clear($event)">
    </i>
  }
</button>

@if (hint()) {
  <span class="hint-content">
    <i class="fa-regular fa-circle-question"></i> {{hint()}}
  </span>
}

<kl-field-errors [field]="control()">
  <ng-container errors>
    <ng-content select="[errors]" />
  </ng-container>
</kl-field-errors>
