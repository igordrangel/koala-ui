<label [attr.for]="fieldId" class="flex items-center gap-2 cursor-pointer">
  <input #inputSwitcher
    [id]="fieldId"
    type="checkbox"
    class="toggle"
    [checked]="control().value"
    [disabled]="disabled()"
    (change)="toggle($event)"
  />

  <ng-content />
</label>

@if (hint()) {
  <span class="hint-content">
    <i class="fa-regular fa-circle-question"></i> {{hint()}}
  </span>
}
